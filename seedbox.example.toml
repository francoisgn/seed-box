# seedbox configuration template: library, connections and schedule.
#
# Deployed copy: /config/seedbox.toml in the container. With deploy/deploy.sh,
# secrets stay out of this file: they come from your deploy config and land in
# secrets/ files on the host. If you do put them here, keep the file 600:
# seedbox warns when a file holding secrets is readable by others.
#
# Any key below can be overridden by an environment variable (README).

[library]
# Library roots as seen by seedbox (inside the container: the mount points).
roots = ["/media/movies", "/media/tv"]
# How deep to look for the folder that holds the media files.
max_depth = 4
# Folders never walked (cross-seed link dir, NAS metadata, recycle bins).
# skip_dirs = [".cross-seed", "@eaDir", "#recycle", "#snapshot", ".Trash-1000"]
# media_ext = [".mkv", ".mp4", ".avi", ".m4v", ".ts", ".iso"]
# Folders holding cross-seed links (names): their torrents are linked copies.
# link_dirs = [".cross-seed"]

[cross_seed]
# cross-seed database, read-only (deploy: CROSS_SEED_DIR). Missing file = off.
# db = "/cross-seed/cross-seed.db"

[tmdb]
# Optional, for release matching (film titles in French, English, original).
# Better as a secret: SEEDBOX_TMDB_API_KEY(_FILE).
# api_key = ""

[qbittorrent]
url = "http://qbittorrent:8080"
username = "admin"
# password = ""                 # secret: prefer the deploy config (secrets/ file)

# Paths reported by qBittorrent -> same location as seen by seedbox.
# Both must be the same filesystem: matching is done by inode.
[qbittorrent.path_map]
"/downloads" = "/media/downloads"

[prowlarr]
# Optional: empty url = disabled.
url = "http://prowlarr:9696"
# api_key = ""                  # secret: Prowlarr > Settings > General > API Key

# Host (announce or indexer site) -> tracker name, when the announce domain
# differs from the site domain, or to merge several hosts into one tracker.
[trackers.aliases]
# "announce.tracker-a.example" = "tracker-a.example"

[output]
dir = "/data"
csv_delimiter = ","             # ";" opens straight in Excel with a French locale
# .torrent files created for upload kept at most: the oldest is replaced.
# created_max = 10

[upload]
# Optional: upload films missing on one tracker through its upload API (an
# "Upload" page next to the dashboard). Off while [upload.api] is absent.
# tracker = "tracker-a.example"      # tracker name as seedbox shows it
# Passkey: a secret (SEEDBOX_UPLOAD_PASSKEY(_FILE)); empty = taken from that
# tracker's announce URL in qBittorrent.
# Real uploads stay off until the tracker approved your account for its API
# and you checked its upload rules: checks and .torrent creation work anyway.
# send = false
# nfo = "seedbox"                    # "seedbox" (header, summary, MediaInfo) or "mediainfo" (report only)
# roots = ["/media/movies"]          # roots holding films (empty = all, series told by name)

# The API as the tracker documents it: seedbox knows no tracker, it follows
# this description. Templates may use {name} {title} {year} {tmdb_id}
# {imdb_id} {size} {resolution} {language} {group}; {passkey} in headers only.
# [upload.api]
# base = "https://www.tracker-a.example"
# timeout = 300                      # seconds: the tracker may build its page before answering
# passkey_pattern = "/([A-Za-z0-9]{8,64})/announce"   # where the passkey sits in the announce URL
# [upload.api.headers]
# Authorization = "Bearer {passkey}"
# [upload.api.probe]                 # optional GET: may the account use the API? (answer shown on the page)
# path = "/api/v1/categories"
# [upload.api.submit]                # multipart POST
# path = "/api/v1/uploads"
# torrent_field = "torrent_file"
# nfo_field = "nfo_file"
# [upload.api.submit.fields]         # every other form field, as the tracker names it
# category_id = "2100"
# presentation_type = "html_auto"
# [upload.api.answer]                # JSON keys of the answer ("a.b" for nested ones)
# code = "code"
# message = "message"
# success = ["ACCEPTED", "ALREADY_ACCEPTED"]   # empty = any 2xx
# review = ["DUPLICATE"]             # codes left for manual review, never retried
# id = "torrent_id"
# infohash = "info_hash"
# candidates = "candidates"
# retry_status = [429]               # wait Retry-After, then try again
# [upload.api.limits]
# per_hour = 30
# nfo_max_bytes = 65535
# torrent_max_bytes = 3145728

[service]
# `seedbox run` collects on schedule; at start only if never done, if the
# config changed, or if a scheduled run was missed while it was down.
#   "04:00" every day, "sun 04:00" weekly, "mon,thu 03:30"... (container TZ)
# Empty schedule = every interval_hours instead.
schedule = "sun 04:00"
interval_hours = 24
port = 8080                     # dashboard HTTP port, no auth: LAN or reverse proxy
# Dashboard actions through qBittorrent: move, recheck, start, skip missing
# extras, remove torrents, collect now. Off by default (no auth on the page).
actions = false
# Host and qBittorrent sampling for the system charts (seconds, 0 = off).
metrics_interval = 300
metrics_days = 14
