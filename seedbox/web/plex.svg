<svg class="logo" viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clawd, eye patch on, watching a film on TV with a bucket of popcorn">
  <ellipse cx="130" cy="171" rx="104" ry="6" fill="#000" opacity=".35"/>
  <!-- TV: thin black bezel, two feet -->
  <path d="M112 132l-8 22h6l9-22zM196 132l8 22h-6l-9-22z" fill="#5f6670"/>
  <rect x="70" y="10" width="164" height="124" rx="6" fill="#1c2128"/>
  <rect x="76" y="16" width="152" height="108" rx="3" fill="#0d1117"/>
  <!-- The film: dusk sky, moon, hills -->
  <rect x="76" y="16" width="152" height="108" rx="3" fill="#1f2a4d"/>
  <rect x="76" y="70" width="152" height="54" fill="#2b3a66"/>
  <circle cx="196" cy="38" r="10" fill="#fde293"/>
  <circle cx="200" cy="35" r="9" fill="#2b3a66" opacity=".55"/>
  <circle cx="100" cy="30" r="1" fill="#e8ebef"/>
  <circle cx="132" cy="24" r="1" fill="#e8ebef"/>
  <circle cx="160" cy="34" r="1.2" fill="#e8ebef"/>
  <circle cx="118" cy="44" r=".9" fill="#e8ebef"/>
  <path d="M76 96l26-20 22 14 26-24 30 22 22-12 26 18v30H76z" fill="#199e70"/>
  <path d="M76 108l34-14 30 10 34-12 30 10 24-6v28H76z" fill="#137a57"/>
  <!-- Player bar: elapsed time in Plex orange -->
  <rect x="84" y="114" width="136" height="3" rx="1.5" fill="#e8ebef" opacity=".35"/>
  <rect x="84" y="114" width="58" height="3" rx="1.5" fill="#e5a00d"/>
  <circle cx="142" cy="115.5" r="3" fill="#e5a00d"/>
  <!-- Clawd -->
  <g>
    <rect x="18" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="27" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="44" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="53" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="12" y="118" width="52" height="36" rx="3" fill="#d97757"/>
    <rect x="4" y="130" width="10" height="9" rx="2" fill="#d97757"/>
    <rect x="25" y="126" width="5" height="10" rx="1" fill="#1a1a1a"/>
    <!-- Pirate eye patch and strap -->
    <path d="M11 121L64 131" stroke="#1a1a1a" stroke-width="2.2"/>
    <path d="M40 126h12v6a6 6 0 0 1-12 0z" fill="#1a1a1a"/>
    <circle cx="46" cy="130" r="1.2" fill="#e8ebef" opacity=".6"/>
    <!-- Right arm around a popcorn bucket -->
    <path d="M62 138l10 3l-2 6l-10-3z" fill="#d97757"/>
    <path d="M66 132h24l-4 30h-16z" fill="#e8ebef"/>
    <path d="M70 132h4l-1 30h-3zM80 132h4l1 30h-3z" fill="#e66767"/>
    <g fill="#fde293">
      <circle cx="68" cy="131" r="3.4"/>
      <circle cx="74" cy="128.5" r="3.6"/>
      <circle cx="80" cy="130" r="3.4"/>
      <circle cx="86" cy="128" r="3.5"/>
      <circle cx="77" cy="125" r="3"/>
      <circle cx="83" cy="124.5" r="2.6"/>
    </g>
    <!-- One kernel on its way up -->
    <circle cx="60" cy="112" r="2.6" fill="#fde293">
      <animate attributeName="cy" values="124;110;124" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
