# Deployment template next to qBittorrent and Prowlarr, used as is by
# deploy/deploy.sh. Host values come from .env, secrets from secrets/ files,
# both rendered at deploy time and never committed (docs/deployment.md).
#
# Key constraint: seedbox must see the library AND the torrent data on the
# same filesystem as qBittorrent does (hardlinks = same inodes). Mount the
# common parent once, read-only.
services:
  seedbox:
    image: ghcr.io/francoisgn/seed-box:${SEEDBOX_VERSION:?set SEEDBOX_VERSION in .env}
    container_name: seedbox
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      # Empty file = not set (the value from seedbox.toml, if any, applies).
      SEEDBOX_QBT_PASSWORD_FILE: /run/secrets/qbt_password
      SEEDBOX_PROWLARR_API_KEY_FILE: /run/secrets/prowlarr_api_key
      SEEDBOX_TMDB_API_KEY_FILE: /run/secrets/tmdb_api_key
      SEEDBOX_PLEX_TOKEN_FILE: /run/secrets/plex_token
    volumes:
      - ./seedbox.toml:/config/seedbox.toml:ro
      - ./secrets:/run/secrets:ro
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media:ro
      # The cross-seed link folder, read-write: the only place seedbox deletes files
      # itself (orphan link files, from the dashboard). Same filesystem, so the
      # inodes still match. Remove this line to keep the media fully read-only.
      - ${MEDIA_ROOT}/.cross-seed:/media/.cross-seed
      - ./data:/data
      # Optional: cross-seed's config folder, read-only, for its search history.
      - ${CROSS_SEED_DIR:-./cross-seed}:/cross-seed:ro
      # Optional: Plex's config folder, read-only: its token and the size of its data.
      - ${PLEX_CONFIG_DIR:-./plex}:/plex:ro
    ports:
      - "${SEEDBOX_PORT:-8080}:8080"
