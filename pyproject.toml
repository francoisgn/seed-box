[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expressions
build-backend = "setuptools.build_meta"

[project]
name = "seedbox"
dynamic = ["version"]
description = "Seeding coverage dashboard: library on disk vs qBittorrent vs Prowlarr"
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
seedbox = "seedbox.cli:main"

[tool.setuptools]
packages = ["seedbox"]

[tool.setuptools.dynamic]
version = { attr = "seedbox.__version__" }

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS/JS strings.
"seedbox/dashboard.py" = ["E501"]
