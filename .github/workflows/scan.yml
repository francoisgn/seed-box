# Container image vulnerability scan (base image and OS packages: seedbox itself
# has no dependency). Results land in the Security tab, code scanning.
name: Container scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new CVEs in the base image show up without a code change.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: seedbox:scan
      - name: Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: seedbox:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Upload to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: container
