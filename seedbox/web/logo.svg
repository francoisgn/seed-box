<svg class="logo" viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clawd, eye patch on, typing on an iMac showing a terminal">
  <ellipse cx="130" cy="171" rx="104" ry="6" fill="#000" opacity=".35"/>
  <!-- iMac: white bezel, blue chin, aluminium stand -->
  <path d="M112 128h36l6 26h-48z" fill="#b9c0ca"/>
  <rect x="98" y="152" width="64" height="6" rx="3" fill="#cfd5dd"/>
  <rect x="44" y="6" width="172" height="124" rx="10" fill="#e8ebef"/>
  <path d="M44 108h172v12a10 10 0 0 1-10 10H54a10 10 0 0 1-10-10z" fill="#8ab4f8"/>
  <rect x="51" y="13" width="158" height="91" rx="4" fill="#0d1117"/>
  <!-- Terminal -->
  <rect x="51" y="13" width="158" height="11" rx="4" fill="#1c2128"/>
  <circle cx="58" cy="18.5" r="2" fill="#f28b82"/>
  <circle cx="64.5" cy="18.5" r="2" fill="#fde293"/>
  <circle cx="71" cy="18.5" r="2" fill="#81c995"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="7">
    <text x="57" y="35" fill="#81c995">$ <tspan fill="#e6edf3">seedbox status</tspan></text>
    <text x="57" y="46" fill="#8ab4f8">✓ <tspan fill="#9da7b3">452 entries, 3 trackers</tspan></text>
    <text x="57" y="57" fill="#fde293">↻ <tspan fill="#9da7b3">recheck 1/8 · 80.7 %</tspan></text>
    <text x="57" y="68" fill="#81c995">⇄ <tspan fill="#9da7b3">moving to archives…</tspan></text>
    <text x="57" y="79" fill="#f28b82">✗ <tspan fill="#9da7b3">2 duplicates on tr4ker</tspan></text>
    <text x="57" y="92" fill="#81c995">$ </text>
  </g>
  <rect x="66" y="86" width="5" height="8" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>
  <!-- Keyboard -->
  <rect x="70" y="158" width="128" height="9" rx="3" fill="#dfe3e8"/>
  <path d="M76 161.5h116M76 164h116" stroke="#b9c0ca" stroke-width=".8" stroke-dasharray="5 1.5"/>
  <!-- Clawd -->
  <g>
    <rect x="18" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="27" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="44" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="53" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="12" y="118" width="52" height="36" rx="3" fill="#d97757"/>
    <rect x="4" y="130" width="10" height="9" rx="2" fill="#d97757"/>
    <!-- right arm reaching the keyboard -->
    <path d="M62 132l14 20l6-4l-12-20z" fill="#d97757"/>
    <rect x="25" y="126" width="5" height="10" rx="1" fill="#1a1a1a"/>
    <!-- Pirate eye patch and strap -->
    <path d="M11 121L64 131" stroke="#1a1a1a" stroke-width="2.2"/>
    <path d="M40 126h12v6a6 6 0 0 1-12 0z" fill="#1a1a1a"/>
    <circle cx="46" cy="130" r="1.2" fill="#e8ebef" opacity=".6"/>
  </g>
</svg>
