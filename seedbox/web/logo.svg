<svg class="logo" viewBox="0 0 240 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Clawd watering seeds that sprout in a row of soil">
  <ellipse cx="130" cy="171" rx="104" ry="6" fill="#000" opacity=".35"/>
  <!-- Soil row -->
  <path d="M96 158h138a6 6 0 0 1 0 12H96a6 6 0 0 1 0-12z" fill="#6b4a2f"/>
  <path d="M104 162h8M130 165h10M168 163h8M204 165h10" stroke="#4e3521" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Seed waiting for water -->
  <ellipse cx="112" cy="157" rx="4" ry="2.6" fill="#c9a66b"/>
  <!-- Sprouts, from a shoot to a small plant -->
  <g stroke="#3f9e6a" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M140 158v-8"/><path d="M168 158v-20"/><path d="M198 158v-32"/><path d="M224 158v-44"/>
  </g>
  <g fill="#81c995">
    <path d="M140 150c-7 0-9-5-9-8c6 0 9 3 9 8z"/><path d="M140 150c6 0 8-4 8-7c-5 0-8 2-8 7z"/>
    <path d="M168 138c-8 0-10-6-10-9c7 0 10 4 10 9z"/><path d="M168 138c7 0 9-5 9-8c-6 0-9 3-9 8z"/>
    <path d="M198 126c-9 0-11-7-11-11c8 0 11 5 11 11z"/><path d="M198 126c8 0 10-6 10-10c-7 0-10 4-10 10z"/>
    <path d="M224 114c-10 0-12-8-12-12c9 0 12 6 12 12z"/><path d="M224 114c9 0 11-7 11-11c-8 0-11 5-11 11z"/>
  </g>
  <!-- Watering can: body, handle, tilted spout, rose -->
  <path d="M76 124c-9 0-9 16 0 16" fill="none" stroke="#3987e5" stroke-width="3"/>
  <rect x="76" y="120" width="30" height="26" rx="4" fill="#5b9bf0"/>
  <rect x="76" y="120" width="30" height="5" rx="2" fill="#8ab4f8"/>
  <path d="M104 138l22-18l3 4l-21 20z" fill="#3987e5"/>
  <path d="M124 114l9 7l-4 6l-9-7z" fill="#8ab4f8"/>
  <!-- Water drops -->
  <g fill="#8ab4f8">
    <circle cx="136" cy="128" r="2"><animate attributeName="cy" values="126;154;154" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="132" cy="126" r="1.6"><animate attributeName="cy" values="124;154;154" dur="1.6s" begin=".5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.6s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="139" cy="125" r="1.6"><animate attributeName="cy" values="123;154;154" dur="1.6s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Clawd -->
  <g>
    <rect x="18" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="27" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="44" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="53" y="150" width="5" height="12" fill="#c4633f"/>
    <rect x="12" y="118" width="52" height="36" rx="3" fill="#d97757"/>
    <rect x="4" y="130" width="10" height="9" rx="2" fill="#d97757"/>
    <!-- right arm holding the can -->
    <path d="M62 132l16 2l-1 7l-16-2z" fill="#d97757"/>
    <rect x="25" y="126" width="5" height="10" rx="1" fill="#1a1a1a"/>
  </g>
</svg>
