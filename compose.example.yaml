# Deployment template next to qBittorrent and Prowlarr. Host-specific values
# live in .env and secrets in seedbox.toml, both rendered at deploy time and
# never committed (see docs/deployment.md).
#
# Key constraint: seedbox must see the library AND the torrent data on the
# same filesystem as qBittorrent does (hardlinks = same inodes). Mount the
# common parent once, read-only.
services:
  seedbox:
    image: ghcr.io/francoisgn/seed-box:${SEEDBOX_VERSION:?set SEEDBOX_VERSION in .env}
    container_name: seedbox
    user: "${PUID:?set PUID in .env}:${PGID:?set PGID in .env}"
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./seedbox.toml:/config/seedbox.toml:ro
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media:ro
      - ./data:/data
    ports:
      - "${SEEDBOX_PORT:-8080}:8080"
